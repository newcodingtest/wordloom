name: wordloom
services:
  app:
    image: wordloom-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - wordloom-origin
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-mac-mini-proxy}"
