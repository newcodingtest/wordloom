<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#192c2a" />
    <meta name="description" content="매일 조금씩, 오래 기억하는 토플 영단어" />
    <title>Wordloom — 토플 영단어</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="#home">✳ Wordloom <small>토플 영단어</small></a
      ><span id="connection" role="status"></span
      ><a href="#settings" aria-label="설정">설정 ↗</a>
    </header>
    <div class="layout">
      <aside>
        <p class="eyebrow">YOUR DAILY WORDS</p>
        <nav aria-label="주 메뉴" id="nav"></nav>
        <p class="aside-note">작은 배움이 모여<br />더 넓은 세상으로.</p>
      </aside>
      <main id="main" tabindex="-1">
        <p role="status">기본 영단어 준비 중…</p>
      </main>
    </div>
    <p id="notice" role="status" aria-live="polite"></p>
    <script type="module" src="./app.js"></script>
  </body>
</html>
